<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F5"/>
      <stop offset="100%" stop-color="#ECE5DE"/>
    </linearGradient>
    <linearGradient id="roseSwirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F2"/>
      <stop offset="50%" stop-color="#FCE1DC"/>
      <stop offset="100%" stop-color="#F2BEB5"/>
    </linearGradient>
    <filter id="ccShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#46241C" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="375" fill="url(#bgCC)"/>

  <!-- Platter -->
  <ellipse cx="250" cy="300" rx="170" ry="32" fill="#DFD2C4" filter="url(#ccShadow)"/>
  <ellipse cx="250" cy="296" rx="160" ry="28" fill="#FFFFFF"/>

  <!-- Cupcake 1 (Left Back) -->
  <g filter="url(#ccShadow)" transform="translate(130, 110) scale(0.85)">
    <!-- Liner -->
    <polygon points="40,110 25,180 95,180 80,110" fill="#E8D5C4"/>
    <!-- Sponge -->
    <ellipse cx="60" cy="110" rx="35" ry="14" fill="#9FB885"/>
    <!-- Buttercream swirl -->
    <path d="M30 110 C20 85 45 65 60 70 C75 65 100 85 90 110 Z" fill="url(#roseSwirl)"/>
    <circle cx="60" cy="65" r="12" fill="#FCE1DC"/>
  </g>

  <!-- Cupcake 2 (Right Back) -->
  <g filter="url(#ccShadow)" transform="translate(250, 110) scale(0.85)">
    <polygon points="40,110 25,180 95,180 80,110" fill="#E8D5C4"/>
    <ellipse cx="60" cy="110" rx="35" ry="14" fill="#9FB885"/>
    <path d="M30 110 C20 85 45 65 60 70 C75 65 100 85 90 110 Z" fill="url(#roseSwirl)"/>
    <circle cx="60" cy="65" r="12" fill="#FCE1DC"/>
  </g>

  <!-- Cupcake 3 (Center Front - Hero) -->
  <g filter="url(#ccShadow)" transform="translate(180, 115)">
    <!-- Fluted Baking Cup / Liner -->
    <polygon points="35,120 18,205 122,205 105,120" fill="#F0E2D5"/>
    <!-- Pleat lines on liner -->
    <line x1="35" y1="120" x2="18" y2="205" stroke="#D3BFA8" stroke-width="2"/>
    <line x1="50" y1="120" x2="38" y2="205" stroke="#D3BFA8" stroke-width="1.5"/>
    <line x1="70" y1="120" x2="70" y2="205" stroke="#D3BFA8" stroke-width="1.5"/>
    <line x1="90" y1="120" x2="102" y2="205" stroke="#D3BFA8" stroke-width="1.5"/>
    <line x1="105" y1="120" x2="122" y2="205" stroke="#D3BFA8" stroke-width="2"/>

    <!-- Pistachio Green Sponge Rim -->
    <ellipse cx="70" cy="120" rx="42" ry="15" fill="#8EA873"/>

    <!-- High Rosette Buttercream Swirl (Saffron Rosewater) -->
    <!-- Swirl base tier -->
    <path d="M25 120 C15 90 45 75 70 80 C95 75 125 90 115 120 Z" fill="url(#roseSwirl)"/>
    <!-- Swirl middle tier -->
    <path d="M35 90 C30 65 55 52 70 56 C85 52 110 65 105 90 Z" fill="url(#roseSwirl)"/>
    <!-- Swirl top peak -->
    <path d="M50 62 C48 40 65 30 70 32 C75 30 92 40 90 62 Z" fill="#FFF6F3"/>
    <path d="M70 32 Q72 20 66 18 Q68 28 70 32 Z" fill="#F2BEB5"/>

    <!-- Crushed Vivid Emerald Pistachio Nibs -->
    <circle cx="55" cy="85" r="3" fill="#588C38"/>
    <circle cx="85" cy="80" r="3.5" fill="#6EA846"/>
    <circle cx="48" cy="105" r="3" fill="#6EA846"/>
    <circle cx="95" cy="100" r="3" fill="#588C38"/>
    <circle cx="68" cy="50" r="2.5" fill="#6EA846"/>
    <circle cx="78" cy="55" r="2" fill="#588C38"/>

    <!-- Delicate Edible Dried Persian Rose Petals -->
    <path d="M60 70 Q55 60 62 62 Q66 68 60 70 Z" fill="#A82845"/>
    <path d="M78 68 Q85 62 82 72 Q75 72 78 68 Z" fill="#B83252"/>
    <path d="M68 40 Q75 35 73 42 Q65 42 68 40 Z" fill="#A82845"/>

    <!-- Saffron Threads (Fine golden orange strands) -->
    <path d="M52 65 Q58 63 62 68" stroke="#D45C10" stroke-width="1.5" fill="none"/>
    <path d="M80 60 Q86 64 88 58" stroke="#D45C10" stroke-width="1.5" fill="none"/>
  </g>
</svg>
